<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Macrocolore</title>
<style>
:root{
--bg:#faf9f7;--card:#ffffff;--tx:#1f1f1d;--tx2:#6b6b66;--tx3:#9a9a93;
--bd:rgba(0,0,0,0.12);--bd2:rgba(0,0,0,0.22);--acc:#185fa5;--accbg:#e6f1fb;--radius:10px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#1a1a18;--card:#242422;--tx:#f0efec;--tx2:#a8a7a1;--tx3:#78776f;
--bd:rgba(255,255,255,0.14);--bd2:rgba(255,255,255,0.26);--acc:#85b7eb;--accbg:#0c2740;
}}
:root[data-theme="dark"]{
--bg:#1a1a18;--card:#242422;--tx:#f0efec;--tx2:#a8a7a1;--tx3:#78776f;
--bd:rgba(255,255,255,0.14);--bd2:rgba(255,255,255,0.26);--acc:#85b7eb;--accbg:#0c2740;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
font-size:16px;line-height:1.5;padding:16px 14px 40px;max-width:560px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin:0 0 2px}
.sub{font-size:13px;color:var(--tx2);margin:0 0 16px}
.card{background:var(--card);border:0.5px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
button{font:inherit;font-size:15px;color:var(--tx);background:transparent;
border:0.5px solid var(--bd2);border-radius:var(--radius);padding:11px 14px;width:100%;cursor:pointer}
button:active{transform:scale(0.985)}
button.primary{background:var(--acc);color:#fff;border-color:transparent}
.row{display:flex;gap:10px}
.row>*{flex:1}
label{display:block;font-size:12px;color:var(--tx2);margin:0 0 4px}
input[type=number]{font:inherit;width:100%;padding:10px;border-radius:var(--radius);
border:0.5px solid var(--bd2);background:transparent;color:var(--tx)}
.hint{font-size:12px;color:var(--tx3);margin:8px 0 0}
.res{display:flex;align-items:center;gap:12px}
.sw{width:64px;height:64px;border-radius:12px;flex:none;border:0.5px solid var(--bd2)}
.gl{width:64px;height:64px;flex:none}
.meta{flex:1;min-width:0}
.nm{font-size:15px;font-weight:500;margin:0}
.mc{font-size:12px;color:var(--tx2);margin:2px 0 0}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.tr{flex:1;height:6px;border-radius:3px;background:var(--bd)}
.tr div{height:6px;border-radius:3px;background:var(--tx2)}
.kv{font-size:12px;color:var(--tx2);width:62px;text-align:right;font-variant-numeric:tabular-nums}
.hist{padding:10px 0;border-top:0.5px solid var(--bd)}
.st{font-size:13px;color:var(--tx2);margin:10px 0 0;min-height:18px}
canvas{display:none}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
background:var(--accbg);color:var(--acc);margin-left:6px}
</style>
</head>
<body>

<h1>Macrocolore</h1>
<p class="sub">Fotografa una tabella nutrizionale, oppure inserisci i valori per 100 g.</p>

<div class="card">
  <button class="primary" id="shot">Scatta o scegli una foto</button>
  <input type="file" id="file" accept="image/*" capture="environment" style="display:none">
  <p class="st" id="status"></p>
</div>

<div class="card">
  <div class="row">
    <div><label>Proteine g</label><input type="number" id="p" step="0.1" min="0" value="0"></div>
    <div><label>Carboidrati g</label><input type="number" id="c" step="0.1" min="0" value="0"></div>
    <div><label>Grassi g</label><input type="number" id="g" step="0.1" min="0" value="0"></div>
  </div>
  <div style="margin-top:10px"><label>Nome (facoltativo)</label>
    <input type="text" id="nome" style="font:inherit;width:100%;padding:10px;border-radius:10px;border:0.5px solid var(--bd2);background:transparent;color:var(--tx)"></div>
  <div class="row" style="margin-top:10px">
    <button id="calc">Calcola</button>
    <button id="save">Salva in lista</button>
  </div>
</div>

<div class="card" id="outcard">
  <div class="res">
    <div class="sw" id="sw"></div>
    <div class="gl" id="gl"></div>
    <div class="meta">
      <p class="nm" id="onm">—</p>
      <p class="mc" id="omc">P 0 · C 0 · G 0</p>
      <div class="bar"><div class="tr"><div id="obar" style="width:0%"></div></div><span class="kv" id="okv">0 kcal</span></div>
    </div>
  </div>
  <p class="hint" id="oinfo"></p>
</div>

<div class="card">
  <p class="mc" style="margin:0 0 4px">Lista salvata</p>
  <div id="hist"></div>
</div>

<canvas id="cv"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script>
var AX=[-90,150,30],D=Math.PI/180,R=24;

function calcola(P,C,G){
  var k=[4*P,4*C,9*G],K=k[0]+k[1]+k[2];
  var mx=Math.max(k[0],k[1],k[2]);
  var M=K/400, Mc=Math.min(1,M);
  var t=k.map(function(v){return mx>0?255*v/mx:0});
  var rgb=t.map(function(v){return Math.max(0,Math.min(255,Math.round(Mc*v+(1-Mc)*128)))});
  var pure=t.map(function(v){return Math.round(v*0.85)});
  var x=0,y=0;
  if(K>0){k.forEach(function(q,i){var w=q/K;x+=w*Math.cos(AX[i]*D);y+=w*Math.sin(AX[i]*D)})}
  var m=Math.sqrt(x*x+y*y);
  return {K:K,M:M,rgb:rgb,pure:pure,ux:m>0.01?x/m:0,uy:m>0.01?y/m:0,ok:m>0.01};
}

function glifo(r){
  var col="rgb("+r.pure[0]+","+r.pure[1]+","+r.pure[2]+")";
  var L=Math.max(Math.min(1,r.M)*R,3);
  var s='<svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="24" fill="none" stroke="var(--bd)" stroke-width="0.8"/>';
  for(var i=0;i<3;i++){var a=AX[i]*D;
    s+='<circle cx="'+(32+Math.cos(a)*24).toFixed(1)+'" cy="'+(32+Math.sin(a)*24).toFixed(1)+'" r="1.6" fill="var(--tx3)"/>';}
  if(r.ok){
    s+='<line x1="32" y1="32" x2="'+(32+r.ux*R).toFixed(1)+'" y2="'+(32+r.uy*R).toFixed(1)+'" stroke="'+col+'" stroke-width="1.6" opacity="0.45"/>';
    s+='<line x1="32" y1="32" x2="'+(32+r.ux*L).toFixed(1)+'" y2="'+(32+r.uy*L).toFixed(1)+'" stroke="'+col+'" stroke-width="5" stroke-linecap="round"/>';
  } else { s+='<circle cx="32" cy="32" r="3" fill="var(--tx3)"/>'; }
  return s+'</svg>';
}

function n(x){return String(Math.round(x*10)/10).replace(".",",")}

function mostra(P,C,G,nome){
  var r=calcola(P,C,G);
  document.getElementById("sw").style.background="rgb("+r.rgb.join(",")+")";
  document.getElementById("gl").innerHTML=glifo(r);
  document.getElementById("onm").textContent=nome||"Senza nome";
  document.getElementById("omc").textContent="P "+n(P)+" · C "+n(C)+" · G "+n(G);
  document.getElementById("obar").style.width=Math.min(100,Math.round(r.K/9))+"%";
  document.getElementById("okv").textContent=Math.round(r.K)+" kcal";
  document.getElementById("oinfo").textContent=
    "M = "+ (Math.round(r.M*100)/100).toString().replace(".",",") +
    (r.M>1?" · fuori scala, tinta satura":" · dentro scala");
  return r;
}

function leggi(){
  return {
    P:parseFloat(document.getElementById("p").value)||0,
    C:parseFloat(document.getElementById("c").value)||0,
    G:parseFloat(document.getElementById("g").value)||0,
    nome:document.getElementById("nome").value.trim()
  };
}

document.getElementById("calc").onclick=function(){
  var v=leggi(); mostra(v.P,v.C,v.G,v.nome);
};

var lista=[];
try{ lista=JSON.parse(localStorage.getItem("macrocolore")||"[]") }catch(e){ lista=[] }

function render(){
  var h=document.getElementById("hist");
  if(!lista.length){ h.innerHTML='<p class="hint">Niente ancora.</p>'; return }
  h.innerHTML=lista.map(function(v){
    var r=calcola(v.P,v.C,v.G);
    return '<div class="hist res">'+
      '<div class="sw" style="width:44px;height:44px;background:rgb('+r.rgb.join(",")+')"></div>'+
      '<div class="gl" style="width:44px;height:44px">'+glifo(r).replace(/width="64" height="64"/,'width="44" height="44"')+'</div>'+
      '<div class="meta"><p class="nm" style="font-size:13px">'+(v.nome||"Senza nome")+'</p>'+
      '<p class="mc">P '+n(v.P)+' · C '+n(v.C)+' · G '+n(v.G)+'</p>'+
      '<div class="bar"><div class="tr"><div style="width:'+Math.min(100,Math.round(r.K/9))+'%"></div></div>'+
      '<span class="kv">'+Math.round(r.K)+' kcal</span></div></div></div>';
  }).join("");
}
render();

document.getElementById("save").onclick=function(){
  var v=leggi();
  if(v.P+v.C+v.G<=0){ document.getElementById("status").textContent="Inserisci almeno un valore."; return }
  lista.unshift(v); lista=lista.slice(0,40);
  try{ localStorage.setItem("macrocolore",JSON.stringify(lista)) }catch(e){}
  render(); mostra(v.P,v.C,v.G,v.nome);
};

document.getElementById("shot").onclick=function(){ document.getElementById("file").click() };

function estrai(testo){
  var t=testo.toLowerCase().replace(/,/g,".");
  function trova(chiavi){
    for(var i=0;i<chiavi.length;i++){
      var re=new RegExp(chiavi[i]+"[^0-9\\n]{0,40}?([0-9]+(?:\\.[0-9]+)?)","i");
      var m=t.match(re);
      if(m) return parseFloat(m[1]);
    }
    return null;
  }
  return {
    P:trova(["protein[ei]","eiwit","protein"]),
    C:trova(["carboidrat[ie]","di cui zuccheri|carbohydrate","koolhydraten"]),
    G:trova(["grassi","fett","fat","lipidi"])
  };
}

document.getElementById("file").onchange=function(e){
  var f=e.target.files && e.target.files[0];
  if(!f) return;
  var st=document.getElementById("status");
  if(typeof Tesseract==="undefined"){ st.textContent="Motore OCR non disponibile. Inserisci i valori a mano."; return }
  st.textContent="Lettura in corso, la prima volta scarica il modello…";
  var img=new Image();
  img.onload=function(){
    var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
    var sc=Math.min(1400/img.width,1);
    cv.width=img.width*sc; cv.height=img.height*sc;
    ctx.drawImage(img,0,0,cv.width,cv.height);
    var d=ctx.getImageData(0,0,cv.width,cv.height);
    for(var i=0;i<d.data.length;i+=4){
      var v=0.299*d.data[i]+0.587*d.data[i+1]+0.114*d.data[i+2];
      v=v<128?Math.max(0,v*0.7):Math.min(255,v*1.25);
      d.data[i]=d.data[i+1]=d.data[i+2]=v;
    }
    ctx.putImageData(d,0,0);
    Tesseract.recognize(cv,"ita+eng")
      .then(function(res){
        var v=estrai(res.data.text||"");
        var trovati=[];
        if(v.P!==null){document.getElementById("p").value=v.P;trovati.push("proteine")}
        if(v.C!==null){document.getElementById("c").value=v.C;trovati.push("carboidrati")}
        if(v.G!==null){document.getElementById("g").value=v.G;trovati.push("grassi")}
        if(trovati.length){
          st.textContent="Letti: "+trovati.join(", ")+". Controlla i numeri.";
          var q=leggi(); mostra(q.P,q.C,q.G,q.nome);
        } else {
          st.textContent="Non ho trovato i valori. Inseriscili a mano.";
        }
      })
      .catch(function(){ st.textContent="OCR fallito. Inserisci i valori a mano." });
  };
  img.onerror=function(){ st.textContent="Immagine non leggibile." };
  img.src=URL.createObjectURL(f);
};
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
  });
}
</script>
</body>
</html>
